name: AutoCal
options:
  bundleIdPrefix: com.jiangyanting.autocal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AutoCal:
    type: application
    platform: iOS
    sources:
      - path: AutoCal
    info:
      path: AutoCal/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # EventKit 權限說明（iOS 17+ full access）
        NSCalendarsFullAccessUsageDescription: "AutoCal 需要行事曆權限，才能把辨識出的行程加入你的行事曆。"
        NSRemindersFullAccessUsageDescription: "AutoCal 需要提醒事項權限，才能把辨識出的待辦加入你的提醒事項。"
        NSMicrophoneUsageDescription: "AutoCal 需要麥克風權限，才能用語音輸入行程。"
        NSSpeechRecognitionUsageDescription: "AutoCal 使用語音辨識，把你說的話轉成文字。"
        # 允許連家裡區網的 HTTP 模型伺服器（僅本機/區網位址）
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangyanting.autocal
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AutoCalShare

  AutoCalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoCalShare
      # 與主 App 共用的解析與寫入程式
      - path: AutoCal/Models
      - path: AutoCal/Services
      - path: AutoCal/ItemCard.swift
    info:
      path: AutoCalShare/Info.plist
      properties:
        CFBundleDisplayName: AutoCal
        NSCalendarsFullAccessUsageDescription: "AutoCal 需要行事曆權限，才能把辨識出的行程加入你的行事曆。"
        NSRemindersFullAccessUsageDescription: "AutoCal 需要提醒事項權限，才能把辨識出的待辦加入你的提醒事項。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 圖片「或」文字「或」網址都可觸發（字典形式會被當成 AND，故改用 predicate）
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
                SUBQUERY($item.attachments, $att,
                  ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
                  OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                  OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                ).@count >= 1
              ).@count == 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangyanting.autocal.share
        GENERATE_INFOPLIST_FILE: NO
